# NGINX: sirve la interfaz y reparte las peticiones de /api/ entre las réplicas del backend.
# Docker resuelve el nombre "api" a las tres réplicas y NGINX las usa por turnos (round robin).
upstream backend_api {
    server api:8000 max_fails=3 fail_timeout=10s;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_next_upstream error timeout http_502 http_503;
    }

    location / {
        try_files $uri /index.html;
    }
}
